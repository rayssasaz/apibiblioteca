spring.application.name=apibiblioteca

# Desativa auto-start do spring-boot-docker-compose para permitir orquestracao explicita via compose.yaml
spring.docker.compose.enabled=false

# Configuracao do Banco de Dados PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracao JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Chaves RSA para Autenticacao JWT (Aula 08)
jwt.public.key=classpath:app.pub
jwt.private.key=classpath:app.key
